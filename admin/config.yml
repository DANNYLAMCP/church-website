backend:
  name: github
  repo: DANNYLAMCP/church-website
  branch: main
  base_url: https://rhenish-cms-auth.lcp51165801.workers.dev

media_folder: "uploads"
public_folder: "/church-website/uploads"
locale: "zh_Hant"

collections:
  # ==========================================
  # 1. 首頁從上到下完整內容修改
  # ==========================================
  - name: "pages"
    label: "📄 網站頁面管理"
    delete: false
    editor:
      preview: false
    files:
      - name: "home"
        label: "🏠 首頁全部內容（依網頁上下順序）"
        file: "content/pages/home.json"
        fields:
          # 區塊 1：頂部橫幅
          - name: "hero_badge"
            label: "【區塊 1】頂部藍色小標籤（如：主日崇拜時間）"
            widget: "string"
            default: "● 主日崇拜 ｜ 逢週日上午 10:00 - 11:30"
          - name: "hero_title_line1"
            label: "【區塊 1】主標題 第一行"
            widget: "string"
            default: "在真道中造就生命"
          - name: "hero_title_line2"
            label: "【區塊 1】主標題 第二行"
            widget: "string"
            default: "在恩典中活出召命"
          - name: "hero_description"
            label: "【區塊 1】副標題說明內文"
            widget: "text"
            default: "以使徒信經為信仰大綱，堅持「唯獨聖經 • 唯獨恩典 • 唯獨信心 • 唯獨基督」。\n歡迎你加入靈糧家園，認識生命真理，得享永生盼望。"

          # 區塊 2：W.E.L.L. 教會目標
          - name: "well_title"
            label: "【區塊 2】W.E.L.L. 標題"
            widget: "string"
            default: "W.E.L.L. 教會目標"
          - name: "well_subtitle"
            label: "【區塊 2】W.E.L.L. 副標題"
            widget: "string"
            default: "扎根聖經真理，建立榮神益人的信仰群體"

          # W - Worship
          - name: "w_title"
            label: "【區塊 2 - W】標題"
            widget: "string"
            default: "Worship 敬拜"
          - name: "w_tagline"
            label: "【區塊 2 - W】副標題"
            widget: "string"
            default: "以心靈誠實回應恩典"
          - name: "w_desc"
            label: "【區塊 2 - W】說明內文"
            widget: "text"
            default: "透過主日崇拜與同心禱告，將榮耀歸於三一上帝，建立以基督為中心的敬拜生活。"

          # E - Evangelism
          - name: "e_title"
            label: "【區塊 2 - E】標題"
            widget: "string"
            default: "Evangelism 宣教"
          - name: "e_tagline"
            label: "【區塊 2 - E】副標題"
            widget: "string"
            default: "走進社區傳揚福音"
          - name: "e_desc"
            label: "【區塊 2 - E】說明內文"
            widget: "text"
            default: "立足荃灣社區，實踐主耶穌基督的大使命，向鄰舍見證主愛，引導人得著救恩。"

          # L - Love
          - name: "l1_title"
            label: "【區塊 2 - L1】標題"
            widget: "string"
            default: "Love 關愛"
          - name: "l1_tagline"
            label: "【區塊 2 - L1】副標題"
            widget: "string"
            default: "在主愛中彼此扶持"
          - name: "l1_desc"
            label: "【區塊 2 - L1】說明內文"
            widget: "text"
            default: "實踐重價恩典的團契生活，彼此體恤照顧、同經風雨，展現屬靈家庭的溫暖與同行。"

          # L - Learn
          - name: "l2_title"
            label: "【區塊 2 - L2】標題"
            widget: "string"
            default: "Learn 學習"
          - name: "l2_tagline"
            label: "【區塊 2 - L2】副標題"
            widget: "string"
            default: "在真道上恆常造就"
          - name: "l2_desc"
            label: "【區塊 2 - L2】說明內文"
            widget: "text"
            default: "勤讀聖經真理，開辦主日學與門徒培育課程，讓生命在真道上扎根成長。"

          # 名言引用區塊
          - name: "quote_text"
            label: "【區塊 2 - 名言】內文"
            widget: "text"
            default: "廉價的恩典乃教會的死敵……重價的恩典是埋藏在地裏的寶貝，人為這寶貝的緣故，就歡歡喜喜去賣掉他一切所有的。"
          - name: "quote_author"
            label: "【區塊 2 - 名言】作者"
            widget: "string"
            default: "— 德國信義宗神學家 潘霍華牧師"

          # 區塊 3：聚會時間列表
          - name: "schedule_list"
            label: "【區塊 3】恆常聚會時間列表"
            widget: "list"
            fields:
              - name: "name"
                label: "聚會名稱"
                widget: "string"
              - name: "desc"
                label: "簡介說明"
                widget: "string"
              - name: "time"
                label: "時間標籤"
                widget: "string"

          # 區塊 4：奉獻支持資訊
          - name: "donation_desc"
            label: "【區塊 4】奉獻支持說明文字"
            widget: "text"
            default: "支持教會事工透過轉數快 (FPS) 或銀行轉帳。如需年終結免稅收據，請於入數後將收條截圖發送至幹事處。"
          - name: "fps_id"
            label: "【區塊 4】轉數快 (FPS) 識別碼"
            widget: "string"
            default: "fps@rhenish-twc.org"
          - name: "bank_account_name"
            label: "【區塊 4】銀行戶口名稱"
            widget: "string"
            default: "中華基督教禮賢會荃灣堂"

          # 區塊 5：聯絡與天氣安排
          - name: "address"
            label: "【區塊 5】堂會地址"
            widget: "string"
            default: "香港新界荃灣（鄰近荃灣港鐵站）"
          - name: "phone"
            label: "【區塊 5】電話查詢"
            widget: "string"
            default: "2149 6440"
          - name: "email"
            label: "【區塊 5】電郵聯絡"
            widget: "string"
            default: "info@rhenish-twc.org"
          - name: "weather_title"
            label: "【區塊 5】惡劣天氣指引標題"
            widget: "string"
            default: "惡劣天氣聚會安排指引"
          - name: "weather_desc"
            label: "【區塊 5】惡劣天氣指引內容"
            widget: "text"
            default: "若天文台於主日早上 8:00 仍懸掛八號或以上風球、或發出黑色暴雨警告信號，實體主日崇拜將會暫停，改為網上聚會或另行通告。"

  # ==========================================
  # 2. 定期發布（週刊、最新消息、講道）
  # ==========================================
  - name: "bulletins"
    label: "📰 上傳每週週刊 (PDF)"
    folder: "content/bulletins"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-bulletin"
    fields:
      - name: "date"
        label: "主日崇拜日期"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - name: "title"
        label: "主日講題"
        widget: "string"
      - name: "speaker"
        label: "宣講講員"
        widget: "string"
      - name: "pdf_file"
        label: "週刊 PDF 檔案"
        widget: "file"

  - name: "announcements"
    label: "📢 發布最新消息與公告"
    folder: "content/announcements"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - name: "title"
        label: "公告標題"
        widget: "string"
      - name: "date"
        label: "發佈日期"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - name: "featured"
        label: "重要置頂"
        widget: "boolean"
        default: false
        required: false
      - name: "body"
        label: "公告詳細內容"
        widget: "markdown"

  - name: "sermons"
    label: "🎥 新增主日講道影音"
    folder: "content/sermons"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-sermon"
    fields:
      - name: "date"
        label: "宣講日期"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
      - name: "title"
        label: "經文與講題"
        widget: "string"
      - name: "speaker"
        label: "講員"
        widget: "string"
      - name: "video_url"
        label: "YouTube 影片連結"
        widget: "string"
        required: false
